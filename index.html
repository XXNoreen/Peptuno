<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peptuno — peptide protocol tracker</title>
<meta name="theme-color" content="#F5609F">
<meta name="apple-mobile-web-app-title" content="Peptuno">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Peptuno: peptide protocol planner, injection calendar, vial tracker and weight log.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8FB; --top:#FFE3EF; --surface:#FFFFFF; --surface2:#FFF1F6; --ink:#2A1822; --muted:#8E7482; --line:#F5DCE7;
  --pink:#F0508F; --pink-600:#D6397A; --pink-400:#FF86B6; --pink-200:#FFC6DC; --pink-100:#FFE3EE; --pink-50:#FFF2F7;
  --t1:#FFE1EC; --t2:#FCE3F4; --t3:#FFEDEF;
  --grad:linear-gradient(135deg,#FF93C1 0%,#F5609F 52%,#DC3580 100%);
  --grad-soft:linear-gradient(180deg,#FFCBE0 0%,#FFE6F0 100%);
  --nav:#26161F; --nav-ink:#FFFFFF; --chip:#F4E9EE;
  --brand:var(--pink); --brand-ink:#FFFFFF; --brand-soft:var(--pink-100);
  --ok:#1C9A5E; --ok-bg:#E1F5EA; --info:#3B69D8; --info-bg:#E8EEFC; --bad:#E0413A; --bad-bg:#FDE7E5;
  --opt:#D67A0E; --opt-bg:#FFF0DA; --rest:#9D8994; --rest-bg:#F5EDF1; --warn:#9A5A07; --warn-bg:#FFF3D8;
  --focus:#D6397A; --shadow:0 10px 30px rgba(214,57,122,.10);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#180E14; --top:#2C1522; --surface:#231620; --surface2:#2D1C27; --ink:#FBEFF5; --muted:#C2A6B5; --line:#3A2432;
  --pink:#FF6FA9; --pink-600:#FF8DBD; --pink-400:#FF9CC5; --pink-200:#5A2640; --pink-100:#3B1D2D; --pink-50:#2A1622;
  --t1:#3A1C2C; --t2:#361D33; --t3:#3A1F27; --grad:linear-gradient(135deg,#FF7FB4 0%,#E84A8C 55%,#BC2A6B 100%); --grad-soft:linear-gradient(180deg,#4A2036 0%,#2E1724 100%);
  --nav:#0E080B; --chip:#33222C; --brand-ink:#1A0E14;
  --ok:#52D695; --ok-bg:#133226; --info:#8AB0FF; --info-bg:#1A2745; --bad:#FF8A82; --bad-bg:#3D1A19;
  --opt:#F7B062; --opt-bg:#3B2811; --rest:#9C8793; --rest-bg:#2E2229; --warn:#F2C063; --warn-bg:#352A10; --focus:#FF8DBD; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#180E14; --top:#2C1522; --surface:#231620; --surface2:#2D1C27; --ink:#FBEFF5; --muted:#C2A6B5; --line:#3A2432;
  --pink:#FF6FA9; --pink-600:#FF8DBD; --pink-400:#FF9CC5; --pink-200:#5A2640; --pink-100:#3B1D2D; --pink-50:#2A1622;
  --t1:#3A1C2C; --t2:#361D33; --t3:#3A1F27; --grad:linear-gradient(135deg,#FF7FB4 0%,#E84A8C 55%,#BC2A6B 100%); --grad-soft:linear-gradient(180deg,#4A2036 0%,#2E1724 100%);
  --nav:#0E080B; --chip:#33222C; --brand-ink:#1A0E14;
  --ok:#52D695; --ok-bg:#133226; --info:#8AB0FF; --info-bg:#1A2745; --bad:#FF8A82; --bad-bg:#3D1A19;
  --opt:#F7B062; --opt-bg:#3B2811; --rest:#9C8793; --rest-bg:#2E2229; --warn:#F2C063; --warn-bg:#352A10; --focus:#FF8DBD; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font:15px/1.5 Outfit,"Avenir Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,var(--top) 0,var(--bg) 380px) no-repeat,var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600}
p{margin:0}
b,strong{font-weight:600}
.app{max-width:1120px;margin:0 auto;padding:0 20px}
main{padding:18px 0 130px}
/* header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:6px 0 20px}
.ttl{font-size:30px;line-height:1.18;font-weight:600;letter-spacing:-.01em}
.ttl span{display:block}
.ttl span:last-child{color:var(--pink)}
.ttl.pf span:first-child{color:var(--pink)}
.ttl.pf span:last-child{color:var(--ink)}
.hdr .date{color:var(--muted);margin-top:6px;font-size:14px}
.hdr-actions{display:flex;gap:8px;position:relative;flex:none}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;position:relative;padding:0;box-shadow:0 4px 14px rgba(214,57,122,.08)}
.round svg{width:20px;height:20px}
.badge{position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;border-radius:10px;background:var(--pink);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.menu{position:absolute;right:0;top:54px;background:var(--surface);border-radius:22px;box-shadow:0 20px 50px rgba(42,24,34,.18);min-width:240px;padding:8px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:14px;font-weight:500}
.menu button:hover{background:var(--surface2)}
.menu button svg{width:18px;height:18px;flex:none;color:var(--pink)}
.menu .mh{padding:10px 12px 10px;margin-bottom:4px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.menu .mh img{width:36px;height:36px;border-radius:50%}
.menu .mh b{display:block;color:var(--ink);font-size:15px}
/* search */
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:999px;padding:0 20px;height:56px;margin-bottom:20px;box-shadow:0 4px 14px rgba(214,57,122,.06)}
.search svg{width:22px;height:22px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;font-size:16px;min-width:0;padding:0}
/* section titles */
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 0 14px}
.sec h2{font-size:19px;font-weight:600}
.sec .lnk{border:0;background:none;color:var(--pink);font-weight:600;font-size:14px;padding:4px}
.sec:first-child{margin-top:0}
/* hero */
.hero{position:relative;border-radius:26px;background:var(--grad);color:#fff;padding:22px 22px;min-height:150px;overflow:hidden;box-shadow:0 18px 40px rgba(220,53,128,.28);margin-top:18px}
.hero .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;font-weight:500}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;top:-90px}
.hero .num{font-size:36px;font-weight:600;line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em}
.hero .subl{font-size:13px;opacity:.88;max-width:60%}
.hero .meter{max-width:64%;flex-wrap:wrap;display:flex;gap:6px;margin-top:14px;align-items:center;font-size:12.5px;opacity:.95}
.hero .meter i{display:block;width:26px;height:6px;border-radius:9px;background:rgba(255,255,255,.35)}
.hero .meter i.on{background:#fff}
.hero .art{position:absolute;right:4px;bottom:-4px;width:130px;height:130px;pointer-events:none;filter:drop-shadow(0 14px 18px rgba(120,20,60,.3))}
.hero .hbtn{margin-top:14px;border:0;background:#fff;color:var(--pink-600);padding:10px 18px;border-radius:999px;font-weight:600}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:0;border-radius:24px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;font-weight:500;font-size:14px;min-height:150px;justify-content:center;color:var(--ink)}
.tile .ti{width:60px;height:60px;border-radius:50%;background:var(--surface);display:grid;place-items:center;position:relative}
.tile .ti svg{width:26px;height:26px;color:var(--ink)}
.tile .ti .plus{position:absolute;right:-4px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--nav);color:#fff;display:grid;place-items:center;border:2px solid var(--surface)}
.tile .ti .plus svg{width:12px;height:12px;color:#fff}
.t1{background:var(--t1)} .t2{background:var(--t2)} .t3{background:var(--t3)}
/* chips */
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button,.tabs-in button{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:500;font-size:14px;white-space:nowrap;flex:none}
.chips button[aria-pressed="true"],.tabs-in button[aria-selected="true"]{background:var(--nav);color:#fff}
.chips button .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font-size:11px;margin-left:6px;padding:0 5px}
.tabs-in{display:flex;gap:8px;flex-wrap:wrap}
/* chip tags */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface);color:var(--ink);border:0}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-done{background:var(--ok-bg);color:var(--ok)}
.st-pending{background:var(--info-bg);color:var(--info)}
.st-missed{background:var(--bad-bg);color:var(--bad)}
.st-optional{background:var(--opt-bg);color:var(--opt)}
.st-rest,.st-skipped,.st-optnot,.st-moved{background:var(--rest-bg);color:var(--rest)}
.lv-plenty{background:var(--ok-bg);color:var(--ok)}
.lv-low{background:var(--warn-bg);color:var(--warn)}
.lv-almost{background:var(--opt-bg);color:var(--opt)}
.lv-empty{background:var(--bad-bg);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:hsl(var(--h) 70% 60%)}
/* generic */
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grid{display:grid;gap:14px}
.card{background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--chip);padding:11px 18px;border-radius:999px;font-weight:500;line-height:1.2;white-space:nowrap;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(220,53,128,.25)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--nav);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{color:var(--bad);background:var(--bad-bg)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.lg{padding:14px 22px;font-size:16px}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{border:0;background:none;padding:8px;border-radius:50%;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.banner{padding:12px 16px;border-radius:18px;background:var(--warn-bg);color:var(--warn);font-size:14px;margin-bottom:16px}
.banner.info{background:var(--pink-100);color:var(--pink-600)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:16px}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
.card .pbar,.stat .pbar{background:var(--surface2)}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
/* dashboard layout */
.dash{display:grid;gap:0 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){ .dash{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)} .dash .sec:first-child{margin-top:0} }
/* injection rows */
.inj{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:22px;background:var(--surface);margin-bottom:10px;cursor:pointer;text-align:left;width:100%;border:0;box-shadow:0 4px 16px rgba(214,57,122,.06)}
.inj .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:hsl(var(--h) 80% 94%);color:hsl(var(--h) 55% 42%);font-weight:600;font-size:16px}
[data-theme="dark"] .inj .ic{background:hsl(var(--h) 30% 22%)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .inj .ic{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 70% 75%)} }
.inj .ic svg{width:20px;height:20px}
.inj .nm{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inj .dt{font-size:13px;color:var(--muted);margin-top:2px}
.inj .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.inj .time{font-weight:600;font-size:13px;background:var(--surface2);padding:4px 10px;border-radius:999px;white-space:nowrap}
.done-btn{border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:12.5px;background:var(--grad);color:#fff;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.done-btn svg{width:14px;height:14px}
.done-btn.is-done{background:var(--ok-bg);color:var(--ok)}
/* vial + pastel cards */
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pc{position:relative;overflow:hidden;border:0;border-radius:24px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:170px;color:var(--ink);width:100%}
.pc::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.35);right:-50px;bottom:-60px;pointer-events:none}
.pc h3{font-size:16px;font-weight:600;line-height:1.3;position:relative;z-index:1}
.pc .big{font-size:28px;font-weight:600;line-height:1.1;position:relative;z-index:1}
.pc .big small{font-size:13px;font-weight:500;color:var(--muted)}
.pc .ps{font-size:12.5px;color:var(--muted);position:relative;z-index:1}
.pc .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px;position:relative;z-index:1}
.pc .vial-svg{position:absolute;right:14px;top:14px;z-index:1}
.warn{margin-top:8px;padding:8px 12px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:500;position:relative;z-index:1}
.warn.bad{background:var(--bad-bg);color:var(--bad)}
.spot{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
/* tables */
.tbl-wrap{overflow-x:auto;border-radius:18px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:12px 14px;background:var(--surface2);white-space:nowrap}
table.t td{padding:11px 14px;border-top:1px solid var(--line);white-space:nowrap}
table.t td.num,table.t th.num{text-align:right}
.sheet td{padding:8px 12px;font-size:13.5px}
.sheet tr.rest td{color:var(--muted)}
.sheet tr.today td{box-shadow:inset 0 2px 0 var(--pink),inset 0 -2px 0 var(--pink)}
.sheet tr.offrow td{text-align:center;font-weight:500;color:var(--muted);background:var(--surface2)}
.sheet tr.clickable{cursor:pointer}
/* calendar */
.calcard{background:var(--surface2);border-radius:26px;padding:18px;margin-top:16px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.cal-nav h2{font-size:18px;white-space:nowrap}
@media (max-width:420px){ .cal-nav h2{font-size:16px} }
.cal-nav .mchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{padding:4px;font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.cell{background:var(--surface);border-radius:16px;min-height:118px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cell:hover{box-shadow:inset 0 0 0 2px var(--pink-200)}
.cell.out{background:transparent}
.cell.out>*{opacity:.5}
.cell .dn{font-size:13px;font-weight:600;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;border:0;background:none;padding:0}
.cell.today .dn{background:var(--grad);color:#fff}
.cell .top{display:flex;justify-content:space-between;align-items:center}
.cell .wt{font-size:11px;font-weight:500;color:var(--muted)}
.pill{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:3px 6px;border-radius:8px;border:0;white-space:nowrap;overflow:hidden;text-align:left;width:100%;min-width:0}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill .si{flex:none;font-size:10px;width:12px;text-align:center}
.pill.s-done{background:var(--ok-bg);color:var(--ok)}.pill.s-pending{background:var(--info-bg);color:var(--info)}.pill.s-missed{background:var(--bad-bg);color:var(--bad)}.pill.s-optional{background:var(--opt-bg);color:var(--opt)}.pill.s-skipped,.pill.s-optnot{background:var(--rest-bg);color:var(--rest)}
.pill.rest{background:none;color:var(--rest);font-weight:400}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.mini .tile{flex-direction:row;justify-content:flex-start;min-height:0;padding:16px;gap:12px;text-align:left}
.mini .tile .ti{width:42px;height:42px}
.mini .tile .ti svg{width:20px;height:20px}
.mini .tile b{display:block;font-size:17px}
.mini .tile span.l{font-size:12.5px;color:var(--muted)}
/* stack cards */
.pgrid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pcard{cursor:pointer;text-align:left;width:100%;border:0;color:var(--ink);position:relative;overflow:hidden}
.pcard::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.4);right:-60px;top:-70px}
.pcard>*{position:relative;z-index:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;text-align:right}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.summary div{padding:12px 14px;border-radius:18px;background:var(--surface2)}
.summary span{display:block;font-size:12px;color:var(--muted)}
.summary b{font-size:15px;font-weight:600}
.recon{background:var(--grad);color:#fff;font-weight:500;padding:14px 18px;border-radius:20px;margin-bottom:14px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sub-head p{color:var(--muted)}
/* modal (sheet) */
.scrim{position:fixed;inset:0;background:rgba(42,24,34,.45);display:none;z-index:50;padding:24px}
.scrim.open{display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg);border-radius:30px;width:min(820px,100%);max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 30px 80px rgba(42,24,34,.35);overscroll-behavior:contain}
.modal.narrow{width:min(500px,100%)}

function forecast(p){
  const key = 'f'+rev+today(); const hitF = fcCache.get(p.id); if(hitF && hitF.key===key) return hitF.v;
  const vs = vialsOf(p.id); const rem = {}; vs.forEach(v=>rem[v.id]=remaining(v));
  const active = vs.filter(v=>!v.emptiedAt && rem[v.id]>1e-9);
  const future = build(p).inst.filter(x=>isOpen(status(x)) && x.date>=today());
  const info = {}; vs.forEach(v=>info[v.id]={empty:null, lastFull:null, covered:0});
  let vi=0, runOut=null, uncovered=0, shortAmt=0; const firstVial = {};
  for(const x of future){
    let need = x.amt; if(need<=0) continue;
    let full = true, startVial = active[vi]?.id;
    while(need>1e-9 && vi<active.length){
      const v=active[vi]; const take=Math.min(need, rem[v.id]); rem[v.id]-=take; need-=take;
      if(!firstVial[x.key]) firstVial[x.key]=v.id;
      if(take < x.amt-1e-9 && v.id===startVial && need>1e-9) full=false;
      if(rem[v.id]<=1e-9){ info[v.id].empty = x.date; vi++; }
    }
    if(need>1e-9){ if(!runOut) runOut=x.date; uncovered++; shortAmt+=need; }
    else if(full && startVial){ info[startVial].lastFull = x.date; info[startVial].covered++; }
  }
  const cur = active[0] || null;
  const totalRem = active.reduce((s,v)=>s+remaining(v),0);
  const next = future[0] || null;
  const size = vs[0] ? num(vs[0].amount) : (p.form==='liquid'?num(p.liquid.vialMl):num(p.recon.mg));
  const v = {cur, curN: cur?cur.n:null, curRem: cur?remaining(cur):0, totalRem, next, nextAmt: next?next.amt:0,
    curEmpty: cur?info[cur.id].empty:null, curLastFull: cur?info[cur.id].lastFull:null, curDoses: cur?info[cur.id].covered:0,
    totalDoses: future.length-uncovered, remainingDoses: future.length, runOut, shortAmt, extraVials: size>0?Math.ceil(shortAmt/size-1e-9):0,
    lastEmpty: active.length? info[active[active.length-1].id].empty : null, info, firstVial,
    warnNext: !!next && totalRem + 1e-9 < next.amt, curShort: !!next && cur && remaining(cur)+1e-9 < next.amt};
  fcCache.set(p.id, {key, v}); return v;
}
function vialLevel(p, v){
  const rem = remaining(v); if(rem<=1e-9) return 'empty';
  const f = forecast(p), nextAmt = f.nextAmt || (build(p).inst[0]?.amt||0);
  const doses = nextAmt>0 ? Math.floor(rem/nextAmt+1e-9) : Infinity, pct = num(v.amount)>0?rem/num(v.amount):1;
  if(doses<=2 || pct<0.12) return 'almost';
  if(doses<=num(S.core.profile.lowDoses) || pct<0.35) return 'low';
  return 'plenty';
}
const LEVEL = {plenty:'Plenty remaining', low:'Running low', almost:'Almost empty', empty:'Empty'};
const levelChip = l => `<span class="chip lv-${l}"><i></i>${LEVEL[l]}</span>`;
function planTotal(p){ let req=0, opt=0; for(const x of build(p).inst){ if(x.movedFrom) continue; if(x.optional) opt+=x.amt; else req+=x.amt; } return {req, opt}; }
function vialNeed(p){ const size = p.form==='liquid'?num(p.liquid.vialMl):num(p.recon.mg); if(!size) return null; const t=planTotal(p); return {req:Math.ceil(t.req/size-1e-9), all:Math.ceil((t.req+t.opt)/size-1e-9), total:t.req+t.opt, hasOpt:t.opt>0}; }
function pStatus(p){
  const pl = curPlan(p), t=today(), L=num(pl.weeksOn)+num(pl.weeksOff), C=Math.max(1,num(pl.cycles)||1), diff=daysBetween(pl.start,t);
  if(daysBetween(firstStart(p),t)<0) return {text:`Starts ${fShort(firstStart(p))}`, week:0, ph:null, upcoming:true};
  if(diff<0) return {text:`Resumes ${fShort(pl.start)}`, week:0, ph:null};
  const c = Math.floor(diff/(L*7||1)), within = diff - c*L*7;
  if(c>=C) return {text:'Protocol complete', week:null, ph:null, done:true};
  if(within < num(pl.weeksOn)*7){ const week=Math.floor(within/7)+1; return {text:(C>1?`Cycle ${c+1} · `:'')+`Week ${week} of ${num(pl.weeksOn)}`, week, ph:phaseFor(pl,week), cycle:c+1, active:true}; }
  const resume = addD(pl.start, (c+1)*L*7);
  return {text: c+1<C ? `Off weeks · resumes ${fShort(resume)}` : `Off weeks until ${fShort(resume)}`, week:null, ph:null, off:true};
}
function nextOf(p){ return build(p).inst.find(x=>isOpen(status(x)) && x.date>=today()); }

function markDone(key, opts={}){
  const x = instByKey(key); if(!x) return; const p=x.p;
  const amt = opts.amt!=null ? opts.amt : x.amt;
  const log = logOf(p.id);
  if(x.movedFrom){ /* the moved copy owns completion */ }
  log[key] = {s:'done', sd:x.date, st:x.time, at: opts.at || new Date().toISOString(), dose:num(x.ph.dose), unit:x.ph.unit, units:x.units, amt, alloc: allocate(p, amt, opts.vial), note: opts.note||'', week:x.week, day:x.day};
  change(logDoc(p.id), 'core');
}
function undo(key){ const x=instByKey(key); const pid=key.split('|')[0]; const log=logOf(pid); const e=log[key];
  if(e && e.s==='moved'){ delete log[key+'~m']; }
  delete log[key]; change(logDoc(pid)); }
function skip(key, note){ const x=instByKey(key); if(!x) return; logOf(x.p.id)[key]={s:'skipped', sd:x.date, st:x.time, at:new Date().toISOString(), note:note||''}; change(logDoc(x.p.id)); }
function reschedule(key, d, t){
  const x=instByKey(key); if(!x) return; const log=logOf(x.p.id);
  const orig = x.orig || key;
  log[orig] = {s:'moved', sd:(x.movedFrom||x.date), st:(instByKey(orig)?.time||x.time), at:new Date().toISOString(), to:{d, t}};
  change(logDoc(x.p.id));
}

function reminders(){
  const out=[]; const t=today(), now=nowHM(), pr=S.core.profile;
  if(pr.remind){
    for(const x of allInst()){ if(!visible(x)) continue; const s=status(x);
      if(x.date===t && isOpen(s)) out.push({kind: x.time && x.time<=now ? 'due' : 'today', x});
      else if(s==='missed' && daysBetween(x.date,t)<=7) out.push({kind:'missed', x}); }
  }
  if(pr.vialAlerts) for(const p of S.core.protocols){ if(pStatus(p).done) continue; const f=forecast(p);
    if(!vialsOf(p.id).length) continue;
    if(f.warnNext) out.push({kind:'vial-out', p, f});
    else if(f.cur && vialLevel(p,f.cur)==='empty') out.push({kind:'vial-empty', p, f});
    else if(f.cur && ['low','almost'].includes(vialLevel(p,f.cur))) out.push({kind:'vial-low', p, f});
  }
  return out;
}

    <div class="ps">${delta==null?'First entry':delta<0?`<span class="down">↓ ${Math.abs(r1(delta)).toFixed(1)} ${wU()}</span> since last entry`:delta>0?`<span class="up">↑ ${r1(delta).toFixed(1)} ${wU()}</span> since last entry`:'No change since last entry'} · ${rel(last.date)}</div>`
    :`<h3>No weight logged yet</h3><div class="ps">Log your weight to see your trend.</div>`}
    <div class="tags">${g?`<span class="chip">Goal: ${r1(toU(g.v,g.u)).toFixed(1)} ${wU()}</span>`:''}<button class="btn dark sm" data-act="add-weight">${I.plus}Log weight</button></div></div>`;
}
function lineChart(pts, opts={}){
  const W=640, H=opts.h||230, L=46, R=14, T=14, B=28;
  if(pts.length<1) return `<div class="empty"><p>No entries in this range.</p></div>`;
  const ys = pts.map(p=>p.v).concat(opts.goal!=null?[opts.goal]:[]);
  let mn=Math.min(...ys), mx=Math.max(...ys); if(mx-mn<1){ mn-=1; mx+=1; } const padY=(mx-mn)*.12; mn-=padY; mx+=padY;
  const t0=pts[0].t, t1=pts[pts.length-1].t, span=Math.max(t1-t0, 86400000);
  const X=t=>L+(pts.length===1?(W-L-R)/2:((t-t0)/span)*(W-L-R)), Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let grid=''; for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Y(v); grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Figtree,sans-serif">${r1(v).toFixed(1)}</text>`; }
  const labels = [pts[0], pts[pts.length-1]].filter((p,i,a)=>i===0||p!==a[0]).map((p,i)=>`<text x="${X(p.t)}" y="${H-8}" text-anchor="${i===0&&pts.length>1?'start':'end'}" font-size="11" fill="var(--muted)" font-family="Figtree,sans-serif">${fShort(p.d)}</text>`).join('');
  const path = pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area = pts.length>1 ? `<path d="${path} L${X(t1)} ${H-B} L${X(t0)} ${H-B} Z" fill="var(--brand)" opacity=".08"/>` : '';
  const goal = opts.goal!=null ? `<line x1="${L}" x2="${W-R}" y1="${Y(opts.goal)}" y2="${Y(opts.goal)}" stroke="var(--ok)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W-R}" y="${Y(opts.goal)-5}" text-anchor="end" font-size="11" fill="var(--ok)" font-family="Figtree,sans-serif">Goal</text>` : '';
  const dots = pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="${pts.length>60?2:3.5}" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"><title>${fShort(p.d)}: ${r1(p.v).toFixed(1)} ${wU()}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Weight chart')}">${grid}${goal}${area}<path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
const wPts = list => list.map(e=>({t:parseD(e.date).getTime()+(e.time?(+e.time.slice(0,2)*60+ +e.time.slice(3))*60000:0), v:toU(e.v,e.u), d:e.date}));

  h += `<div class="stats" style="margin-bottom:18px">

    <p class="muted xs" style="margin-top:10px">Weight entries are shown for your own tracking. Peptuno doesn't draw health conclusions from them.</p>`;

function weekHero(){
  const t=today(), ti=parseD(t).getDay(), ws=addD(t,-ti);
  const byD={}; allInst().filter(visible).forEach(x=>(byD[x.date] ||= []).push(x));
  let days='';
  for(let i=0;i<7;i++){
    const d=addD(ws,i), xs=byD[d]||[], ss=xs.map(status);
    const st = !xs.length?'' : ss.includes('missed')?'missed' : ss.every(s=>['done','skipped','optnot'].includes(s))?'done' : 'pending';
    const lab = st==='done'?'all done':st==='missed'?'has a missed dose':st==='pending'?'doses scheduled':'no doses';
    days += `<button class="wd ${d===t?'is-today':''}" data-act="day" data-v="${d}" aria-label="${fFull(d)}, ${lab}"><span class="wl">${WD[i]}</span><span class="wn">${parseD(d).getDate()}</span><span class="wi ${st}">${st==='done'?I.check:st==='missed'?'!':''}</span></button>`;
  }
  const td=(byD[t]||[]), tdDone=td.filter(x=>status(x)==='done').length, C=2*Math.PI*22, pct=td.length?tdDone/td.length:0;

    <div class="wk-days">${days}</div>
    <div class="wk-next"><svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="22" fill="none" stroke="var(--pink-100)" stroke-width="7"/><circle cx="29" cy="29" r="22" fill="none" stroke="var(--pink)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 29 29)"/><text x="29" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="Outfit,sans-serif">${td.length?tdDone+'/'+td.length:'–'}</text></svg>
      <div style="min-width:0"><div class="muted small">${ni?ni.lab:'Nothing scheduled'}</div><div class="wk-n">${ni?ni.big:'All done'}</div><div class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ni?esc(ni.n.p.name+' · '+doseTxt(ni.n.ph)+(ni.n.time?' · '+fT(ni.n.time):'')):'No upcoming injections'}</div></div></div>
  </section>`;

function vCal(){
  const t=today(), y=calMonth.getFullYear(), m=calMonth.getMonth();

  const byD = {}; for(const x of allInst()){ if(!visible(x)) continue; (byD[x.date] ||= []).push(x); }

        <label class="f">Actual date<input type="date" id="ev-d" value="${x.date<=today()?today():x.date}"></label><label class="f">Actual time<input type="time" id="ev-t" value="${nowHM()}"></label>
        <label class="f">Vial used<select id="ev-v"><option value="">Automatic (current vial)</option>${vs.map(v=>`<option value="${v.id}">Vial #${v.n} · ${amtTxt(p,remaining(v))} left</option>`).join('')}</select></label>
        <label class="f">Amount deducted (${vialUnit(p)})<input type="number" step="any" min="0" id="ev-a" value="${tn(r2(x.amt*1000)/1000)}"></label></div>
        <label class="f" style="margin-top:12px">Notes (optional)<input type="text" id="ev-n" placeholder="e.g. Left abdomen"></label></fieldset>`;
    }
    if(evMode==='move') body += `<fieldset style="margin-top:18px"><legend>Reschedule to</legend><div class="fg"><label class="f">New date<input type="date" id="mv-d" value="${addD(x.date>today()?x.date:today(), x.date>=today()?1:0)}"></label><label class="f">New time<input type="time" id="mv-t" value="${esc(x.time)}"></label></div><p class="hint">Only this injection moves. The rest of the schedule stays the same.</p></fieldset>`;
    if(evMode==='skip') body += `<fieldset style="margin-top:18px"><legend>Skip this injection</legend><label class="f">Reason (optional)<input type="text" id="sk-n"></label></fieldset>`;
    let foot;
    if(evMode==='done') foot = `<div class="r"><button class="btn" data-act="ev-mode" data-v="">Back</button><button class="btn ok" data-act="ev-save-done" data-k="${esc(key)}">${I.check}Save as done</button></div>`;
    else if(evMode==='move') foot = `<div class="r"><button class="btn" data-act="ev-mode" data-v="">Back</button><button class="btn primary" data-act="ev-save-move" data-k="${esc(key)}">Reschedule</button></div>`;
    else if(evMode==='skip') foot = `<div class="r"><button class="btn" data-act="ev-mode" data-v="">Back</button><button class="btn primary" data-act="ev-save-skip" data-k="${esc(key)}">Skip injection</button></div>`;
    else if(s==='done'||s==='skipped') foot = `<button class="btn" data-act="undo" data-k="${esc(key)}">${I.undo}${s==='done'?'Undo — mark not done':'Undo skip'}</button><div class="r"><button class="btn" data-act="close">Close</button></div>`;
    else foot = `<div class="row wrap"><button class="btn" data-act="ev-mode" data-v="skip">Skip</button><button class="btn" data-act="ev-mode" data-v="move">Reschedule</button>${x.movedFrom?`<button class="btn" data-act="undo" data-k="${esc(x.orig)}">Move back</button>`:''}</div><div class="r">${s==='missed'?`<button class="btn" data-act="close">Leave as missed</button>`:''}<button class="btn" data-act="ev-mode" data-v="done">Done with details</button><button class="btn ok" data-act="done" data-k="${esc(key)}">${I.check}Mark as done</button></div>`;
    return {narrow:true, title:'Injection details', body, foot};
  });
}

/* =================== my stack =================== */
function vStack(){
  const tabs = [['protocols','Protocols'],['vials','Vials'],['history','History']];
  let h = hdr("What's in",'your stack') + `<div class="sub-head"><div class="tabs-in" role="tablist" style="margin:0">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${stackTab===k}" data-act="stab" data-v="${k}">${l}</button>`).join('')}</div><button class="btn primary lg" data-act="add">${I.plus}Add Stack</button></div>`;
  if(stackTab==='protocols') h += `<div class="imp-bar"><div><b>Share protocols</b><span class="muted small">Import a protocol CSV exported from Peptuno, or fill in the template.</span></div><div class="row wrap" style="gap:8px"><button class="btn" data-act="imp-proto">${I.up}Import protocol</button><button class="btn" data-act="dl-template">${I.dl}Template</button></div></div>`;
  if(stackTab==='vials') return h + vVials();
  if(stackTab==='history') return h + vHistory();
  if(!S.core.protocols.length) return h + `<div class="card empty"><h3>No protocols yet</h3><p>Add one and Peptuno will build its schedule, calendar events and vial tracking.</p><button class="btn primary lg" data-act="add">${I.plus}Add Stack</button></div>`;
  const groups = [['Active stack', S.core.protocols.filter(p=>!pStatus(p).done)], ['Completed', S.core.protocols.filter(p=>pStatus(p).done)]];
  for(const [title, list] of groups){ if(!list.length) continue;
    h += `<h3 style="font-size:14px;color:var(--muted);margin:6px 0 12px">${title}</h3><div class="grid pgrid" style="margin-bottom:24px">` + list.map((p,i)=>{ const st=pStatus(p), n=nextOf(p), f=forecast(p), a=build(p).inst.filter(x=>!x.movedFrom||true), doneN=a.filter(x=>status(x)==='done').length, totalN=a.filter(x=>visible(x)).length;
      return `<button class="card pcard t${i%3+1}" style="--h:${p.hue}" data-act="open-proto" data-v="${p.id}"><div class="row between" style="align-items:flex-start"><h3 style="font-size:17px">${esc(p.name)}</h3><span class="chip">${esc(st.text)}</span></div>
        <dl class="kv"><dt>Frequency</dt><dd>${esc(planFreqText(curPlan(p)))}</dd><dt>Current dose</dt><dd>${st.ph?esc(doseFull(p,st.ph)):'—'}</dd><dt>Next</dt><dd>${n?rel(n.date)+(n.time?', '+fT(n.time):''):'—'}</dd>
        <dt>Vial remaining</dt><dd>${f.cur?amtTxt(p,f.curRem)+` (#${f.cur.n})`:'—'}</dd><dt>Vial empty</dt><dd>${f.curEmpty?fShort(f.curEmpty):'—'}</dd></dl>
        <div class="row between xs muted" style="margin-top:12px"><span>${doneN} of ${totalN} injections done</span><span>${totalN?Math.round(doneN/totalN*100):0}%</span></div><div class="pbar" style="margin-top:6px;--h:${p.hue}"><i style="width:${totalN?doneN/totalN*100:0}%"></i></div></button>`; }).join('') + `</div>`; }
  return h;
}
function vVials(){
  if(!S.core.protocols.length) return `<div class="card empty"><h3>No vials yet</h3><p>Vials are added when you create a protocol.</p></div>`;
  return S.core.protocols.map(p=>{ const f=forecast(p), vs=vialsOf(p.id);
    return `<section class="card" style="margin-bottom:18px;--h:${p.hue}"><div class="card-h wrap"><h2 class="row"><span class="dot"></span>${esc(p.name)}</h2><button class="btn sm" data-act="add-vial" data-v="${p.id}">${I.plus}Add vial</button></div>
      ${f.warnNext?`<div class="warn bad" style="margin:-4px 0 12px">⚠️ Vial may run out before next scheduled dose</div>`:f.runOut?`<div class="warn" style="margin:-4px 0 12px">Inventory covers doses until ${fShort(f.runOut)}. About ${f.extraVials} more vial${f.extraVials===1?'':'s'} needed to finish the protocol.</div>`:''}
      ${vs.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px">${vs.map(v=>{ const l=vialLevel(p,v), rem=remaining(v), inf=f.info[v.id]||{}, isCur=f.cur?.id===v.id;
        return `<div class="stat" style="${isCur?'border-color:hsl(var(--h) 60% 46%);box-shadow:inset 0 0 0 1px hsl(var(--h) 60% 46%)':''}"><div class="row between"><b style="font-size:16px">Vial #${v.n}${isCur?' · current':''}</b>${levelChip(l)}</div>
          <div class="row" style="margin-top:10px;gap:12px">${vialSvg(num(v.amount)?rem/num(v.amount):0,p.hue)}<div class="small" style="line-height:1.7">Starting: <b>${amtTxt(p,num(v.amount))}</b><br>Used: <b>${amtTxt(p,used(v.id))}</b><br>Remaining: <b>${amtTxt(p,rem)}</b></div></div>
          <p class="small muted" style="margin-top:8px">${v.emptiedAt?`Marked empty ${fShort(v.emptiedAt)}`:l==='empty'?'Used up':inf.empty?`Estimated empty ${fShort(inf.empty)}`:'Lasts past the protocol'}${!v.emptiedAt&&inf.lastFull?` · last full dose ${fShort(inf.lastFull)}`:''}</p>
          <div class="row wrap" style="margin-top:10px;gap:6px"><button class="btn sm" data-act="edit-vial" data-v="${v.id}">Edit</button><button class="btn sm" data-act="vial-hist" data-v="${v.id}">History</button>${v.emptiedAt?`<button class="btn sm" data-act="unempty-vial" data-v="${v.id}">Undo empty</button>`:`<button class="btn sm" data-act="empty-vial" data-v="${v.id}">Mark empty</button>`}</div></div>`; }).join('')}</div>`:'<p class="muted">No vials. Add one to track remaining amounts.</p>'}</section>`; }).join('');
}
function vHistory(){
  const rows=[]; for(const p of S.core.protocols){ if(histFilter && p.id!==histFilter) continue; for(const [k,e] of Object.entries(logOf(p.id))) if(e.s==='done'||e.s==='skipped'||e.s==='moved') rows.push({p,k,e}); }
  rows.sort((a,b)=>(b.e.at||'').localeCompare(a.e.at||''));
  const sel = `<select id="hist-f" style="max-width:260px;margin-bottom:14px" aria-label="Filter by protocol"><option value="">All protocols</option>${S.core.protocols.map(p=>`<option value="${p.id}" ${histFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
  if(!rows.length) return sel+`<div class="card empty"><h3>No history yet</h3><p>Completed, skipped and rescheduled injections show up here.</p></div>`;
  return sel + `<div class="tbl-wrap"><table class="t"><thead><tr><th>Completed</th><th>Peptide</th><th>Scheduled</th><th>Dose</th><th class="num">Units</th><th>Vial</th><th class="num">Deducted</th><th>Notes</th></tr></thead><tbody>${rows.map(({p,k,e})=>{
    const at=e.at?new Date(e.at):null, atS = at?`${MON[at.getMonth()].slice(0,3)} ${at.getDate()}, ${fT(pad(at.getHours())+':'+pad(at.getMinutes()))}`:'—';
    const vial = (e.alloc||[]).map(([id])=>{ const v=S.core.vials.find(v=>v.id===id); return v?'#'+v.n:'—'; }).join(', ');
    const label = e.s==='done'?atS : e.s==='skipped'?`${chip('skipped')}` : `${chip('moved')} → ${fShort(e.to?.d||'')}`;
    return `<tr><td>${label}</td><td><span class="row" style="gap:6px;--h:${p.hue}"><span class="dot"></span>${esc(p.name)}</span></td><td>${fShort(e.sd||k.split('|')[1])}${e.st?' '+fT(e.st):''}</td><td>${e.s==='done'?esc(tn(num(e.dose))+' '+(e.unit||'')):'—'}</td><td class="num">${e.units!=null&&e.s==='done'?tn(e.units):'—'}</td><td>${vial||'—'}</td><td class="num">${e.s==='done'?amtTxt(p,num(e.amt)):'—'}</td><td class="muted">${esc(e.note||'')}</td></tr>`; }).join('')}</tbody></table></div>`;
}

/* ---------- protocol detail ---------- */
let delArm = null, showWChart = false;
function openProto(id){
  showWChart = false;
  openModal(()=>{
    const p=protoById(id); if(!p){ closeModal(); return null; }
    const pl=curPlan(p), st=pStatus(p), n=nextOf(p), f=forecast(p), need=vialNeed(p), b=build(p), vs=vialsOf(p.id);
    const reconTxt = p.form==='liquid' ? `${esc(p.name)} — ready-made liquid${num(p.liquid.vialMl)?`, ${tn(num(p.liquid.vialMl))} ml vial`:''}${num(p.liquid.conc)?` (${tn(num(p.liquid.conc))} mg/ml)`:''}` : `${esc(p.name)} — ${tn(num(p.recon.mg))} mg reconstituted with ${tn(num(p.recon.ml))} ml diluent (${tn(r2(conc(p)*1000)/1000)} mg/ml)`;
    const summary = `<div class="summary">
      <div><span>Cycle</span><b>${num(pl.weeksOn)} weeks ON / ${num(pl.weeksOff)} weeks OFF${num(pl.cycles)>1?` × ${num(pl.cycles)}`:''}</b></div>
      <div><span>Frequency</span><b>${esc(planFreqText(pl))}</b></div>
      <div><span>Vial need</span><b>${need?`${need.req} vial${need.req===1?'':'s'}${need.hasOpt&&need.all>need.req?` (${need.all} with optional)`:''}`:'—'}</b></div>
      <div><span>Start date</span><b>${fLong(firstStart(p))}</b></div>
      <div><span>Current week</span><b>${st.week?`Week ${st.week}`:esc(st.text)}</b></div>
      <div><span>Current dose</span><b>${st.ph?esc(doseFull(p,st.ph)):'—'}</b></div>
      <div><span>Next injection</span><b>${n?fShort(n.date)+(n.time?', '+fT(n.time):''):'—'}</b></div>
      <div><span>Vial remaining</span><b>${f.cur?amtTxt(p,f.curRem)+` (#${f.cur.n})`:'—'}</b></div>
      <div><span>Estimated vial empty</span><b>${f.curEmpty?fLong(f.curEmpty):(f.cur?'After protocol':'—')}</b></div>
      <div><span>Times</span><b>${(pl.times||[]).map(t=>`${SLOT_EMOJI[t.label]||'⏰'} ${t.time?fT(t.time):t.label}`).join(', ')}</b></div></div>`;
    const vialBlock = `<section style="margin-top:18px"><div class="card-h"><h2 style="font-size:16px">💉 Vial status</h2><button class="btn sm" data-act="go-vials">Manage vials</button></div>${vs.length&&f.cur?`<div class="summary">
      <div><span>Current vial</span><b>#${f.cur.n} of ${vs.length}</b></div><div><span>Starting amount</span><b>${amtTxt(p,num(f.cur.amount))}</b></div><div><span>Used</span><b>${amtTxt(p,used(f.cur.id))}</b></div><div><span>Remaining</span><b>${amtTxt(p,f.curRem)}</b></div>
      <div><span>Doses left in this vial</span><b>${f.curDoses}</b></div><div><span>Estimated empty</span><b>${f.curEmpty?fLong(f.curEmpty):'After protocol'}</b></div><div><span>Last scheduled dose from vial</span><b>${f.curLastFull?fLong(f.curLastFull):'—'}</b></div><div><span>All vials last until</span><b>${f.runOut?fLong(f.runOut):'End of protocol'}</b></div></div>
      ${f.warnNext?`<div class="warn bad">⚠️ Vial may run out before next scheduled dose</div>`:f.curShort?`<div class="warn">The current vial won't cover the next full dose. Vial #${f.cur.n+1} will be needed.</div>`:''}${f.runOut?`<div class="warn">About ${f.extraVials} more vial${f.extraVials===1?'':'s'} needed to finish this protocol.</div>`:''}`:`<p class="muted">${vs.length?'All vials are used up.':'No vials added.'} <button class="btn sm" data-act="add-vial" data-v="${p.id}">${I.plus}Add vial</button></p>`}</section>`;
    // weight during stack
    const endD = [today(), planEnd(pl)].sort()[0];
    const ws = weights().filter(e=>e.date>=firstStart(p) && e.date<=endD);
    const before = weights().filter(e=>e.date<firstStart(p) && daysBetween(e.date,firstStart(p))<=7).slice(-1);
    const wl = [...before, ...ws];
    const wBlock = wl.length ? `<section style="margin-top:18px"><div class="card-h"><h2 style="font-size:16px">⚖️ Weight during this stack</h2><button class="btn sm" data-act="toggle-wchart">${showWChart?'Hide chart':'Show chart'}</button></div>
      <div class="summary"><div><span>Starting weight</span><b>${wFmt(toU(wl[0].v,wl[0].u))} <span class="muted xs">${fShort(wl[0].date)}</span></b></div><div><span>Latest weight</span><b>${wFmt(toU(wl[wl.length-1].v,wl[wl.length-1].u))} <span class="muted xs">${fShort(wl[wl.length-1].date)}</span></b></div><div><span>Entries</span><b>${wl.length}</b></div></div>
      ${showWChart?`<div style="margin-top:10px">${lineChart(wPts(wl),{h:190})}</div>`:`<p class="small muted" style="margin-top:8px">${wl.slice(-6).map(e=>`${fShort(e.date)} — ${wFmt(toU(e.v,e.u))}`).join(' · ')}</p>`}
      <p class="muted xs" style="margin-top:6px">Shown for tracking only. It doesn't mean a peptide caused any change.</p></section>` : '';
    // table
    const t=today(), W=num(pl.weeksOn)||1;
    const multi = Math.max(...p.plans.map(x=>(x.times||[]).length))>1;
    const trs = b.rows.map(r=>{
      if(r.off) return `<tr class="offrow"><td colspan="${multi?8:7}">Weeks off · ${fShort(r.date)} – ${fShort(r.end)}</td></tr>`;
      const shade = `background:hsl(${p.hue} 60% 46% / ${(0.05+0.3*((r.week-1)/Math.max(1,W-1))).toFixed(3)})`;
      if(!r.on) return `<tr class="rest ${r.date===t?'today':''}" style="${shade}"><td>${fShort(r.date)}</td><td>${r.day}</td><td>Week ${r.week}${r.optional?' <span class="chip st-optional">Optional</span>':''}</td><td>–</td><td>–</td>${multi?'<td></td>':''}<td>–</td><td>${chip('rest','Rest')}</td></tr>`;
      return r.keys.map((k,i)=>{ const x=b.inst.find(y=>y.key===k); const s=status(x); const e=logOf(p.id)[k];
        let vcol = '–'; if(e?.alloc) vcol = e.alloc.map(([id])=>{ const v=S.core.vials.find(v=>v.id===id); return v?'Vial '+v.n:'—'; }).join(', '); else if(f.firstVial[k]) vcol='Vial '+(S.core.vials.find(v=>v.id===f.firstVial[k])?.n||'');
        const lab = s==='moved' ? `Moved → ${fShort(e.to.d)}` : s==='pending'?'Pending':null;
        return `<tr class="clickable ${r.date===t?'today':''}" style="${shade}" data-act="event" data-k="${esc(s==='moved'?k+'~m':k)}"><td>${fShort(r.date)}</td><td>${r.day}</td><td>Week ${r.week}${r.optional?' <span class="chip st-optional">Optional</span>':''}</td><td>${esc(doseTxt(x.ph))}</td><td>${x.units!=null?tn(x.units):'–'}</td>${multi?`<td>${esc(x.time?fT(x.time):x.slot)}</td>`:''}<td>${vcol}</td><td>${chip(s,lab)}</td></tr>`; }).join('');
    }).join('');
    const table = `<section style="margin-top:22px"><div class="card-h"><h2 style="font-size:16px">Protocol table</h2><button class="btn sm" data-act="csv" data-v="${p.id}">${I.dl}Export / share CSV</button></div><div class="tbl-wrap"><table class="t sheet"><thead><tr><th>Date</th><th>Day</th><th>Week</th><th>Dose</th><th>Units</th>${multi?'<th>Time</th>':''}<th>Vial</th><th>Status</th></tr></thead><tbody>${trs}</tbody></table></div><p class="muted xs" style="margin-top:8px">Generated from your protocol settings. Tap a row for details. The exported CSV can be imported by other Peptuno users with My Stack → Import protocol.</p></section>`;
    const pp = pepOf(p.peptide);
    return {title:esc(p.name), body:`<div style="--h:${p.hue}"><div class="recon">${reconTxt}</div>${summary}${p.notes?`<p class="small" style="margin-top:12px"><b>Notes:</b> ${esc(p.notes)}</p>`:''}${vialBlock}${wBlock}${table}</div>`,
      foot:`<button class="btn danger" data-act="del-proto" data-v="${p.id}">${I.trash}${delArm===p.id?'Tap again to delete':'Delete'}</button><div class="r">${pp?`<button class="btn" data-act="about" data-v="${esc(pp.key)}">${I.book}About</button>`:''}<button class="btn primary" data-act="edit-proto" data-v="${p.id}">${I.edit}Edit protocol</button></div>`};
  });
}

  else { const used=new Set(S.core.protocols.map(x=>x.hue));
    wiz = {step:0, editId:null, d:Object.assign({peptide:'', name:'', hue:HUES.find(h=>!used.has(h))??HUES[0], form:'powder', recon:{mg:10, ml:3}, liquid:{vialMl:10, conc:''}, nVials:1, notes:'',
      plan:{start:today(), weeksOn:8, weeksOff:4, cycles:1, freq:{type:'daily', days:[1,3,5], weekday:new Date().getDay(), on:5, off:2, every:3}, times:[{label:'Morning',time:'08:00'}], phases:[{from:1,to:8,dose:0.25,unit:'mg',units:'',optional:false,freq:''}]}}, pre||{})}; }
  const f = wiz.d.plan.freq; f.days ||= [1,3,5]; f.weekday ??= parseD(wiz.d.plan.start).getDay(); f.on ??= 5; f.off ??= 2; f.every ??= 3;

}

function wizValidate(){
  const d=wiz.d, pl=d.plan, err=$('#wz-err'); const bad = m => { err.textContent=m; return false; };
  if(wiz.step===0){ if(!d.peptide) return bad('Choose a peptide or create a new one.'); if(d.peptide==='__new' && !(d.newPep||'').trim()) return bad('Type a name for the new peptide.'); if(!d.name.trim()) d.name = d.peptide==='__new'?d.newPep.trim():(pepOf(d.peptide)?.name||''); }
  if(wiz.step===1){ if(d.form==='powder' && !(num(d.recon.mg)>0 && num(d.recon.ml)>0)) return bad('Enter the peptide amount and diluent volume.'); if(d.form==='liquid' && !(num(d.liquid.vialMl)>0)) return bad('Enter the vial volume.'); }
  if(wiz.step===2){ if(!pl.start) return bad('Pick a start date.'); if(!(num(pl.weeksOn)>=1)) return bad('Weeks ON must be at least 1.'); }
  if(wiz.step===3){ const f=pl.freq; if((f.type==='weekdays'||f.type==='rel') && !(f.days||[]).length) return bad('Pick at least one day.'); }
  if(wiz.step===4){ if(pl.phases.some(p=>num(p.from)<1 || num(p.to)<num(p.from))) return bad('Check your rows: "To week" must be the same as or after "From week".'); if(pl.phases.some(p=>!(num(p.dose)>0))) return bad('Every row needs a dose.'); }
  return true;
}
function sanitizePlan(pl){

  if(f.type==='weekdays'||f.type==='rel') cleanF.days=[...(f.days||[])]; if(f.type==='weekly') cleanF.weekday=num(f.weekday); if(f.type==='onoff'){ cleanF.on=num(f.on); cleanF.off=num(f.off); } if(f.type==='every') cleanF.every=num(f.every);
  return {start:pl.start, weeksOn:num(pl.weeksOn), weeksOff:num(pl.weeksOff), cycles:Math.max(1,num(pl.cycles)||1), freq:cleanF, times:pl.times.map(t=>({label:t.label,time:t.time||''})), phases:pl.phases.map(p=>({from:num(p.from),to:num(p.to),dose:num(p.dose),unit:p.unit,units:p.units===''||p.units==null?'':num(p.units),optional:!!p.optional,freq:p.freq||''}))};
}

function applyEdit(future){

const PHASE_FREQ_STR = {'':'', daily:'daily', eod:'every other day', mwf:'Mon Wed Fri', mth:'Mon Thu', on5:'5 on 2 off', weekly:'weekly'};
const WDN = ['sun','mon','tue','wed','thu','fri','sat'];
function freqToStr(f){
  switch(f.type){
    case 'daily': return 'daily';
    case 'eod': return 'every other day';
    case 'every': return `every ${num(f.every)} days`;
    case 'onoff': return `${num(f.on)} on ${num(f.off)} off`;
    case 'weekdays': return [...(f.days||[])].sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>WD[d]).join(' ');
    case 'weekly': return `weekly ${WD[num(f.weekday)]}`;
    case 'rel': return 'days '+[...(f.days||[])].sort((a,b)=>a-b).map(d=>d+1).join(' ');
  }
  return 'daily';
}
function strToFreq(raw){
  const s = String(raw||'').toLowerCase().replace(/[,;|/]+/g,' ').replace(/\s+/g,' ').trim();
  if(!s || /^(daily|every ?day|each day|[1-4] ?x (per|a) day|once a day|twice a day)$/.test(s)) return {type:'daily'};
  if(/every other day|^eod$|alternate days?/.test(s)) return {type:'eod'};
  let m = s.match(/every (\d+) days?/); if(m) return {type:'every', every:Math.max(2,+m[1])};
  m = s.match(/(\d+)\s*(?:days?)?\s*on\D+?(\d+)\s*(?:days?)?\s*off/); if(m) return {type:'onoff', on:Math.max(1,+m[1]), off:+m[2]};
  m = s.match(/^(?:cycle )?days? ((?:\d\s?)+)$/); if(m){ const d=[...new Set(m[1].split(' ').map(Number).filter(n=>n>=1&&n<=7).map(n=>n-1))]; if(d.length) return {type:'rel', days:d}; }
  const found = [...new Set((s.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*/g)||[]).map(t=>WDN.indexOf(t.slice(0,3))))];
  if(/weekly|once a week|1 ?x (per|a) week/.test(s)) return found.length ? {type:'weekly', weekday:found[0]} : {type:'weekly', weekday:null};
  if(found.length) return {type:'weekdays', days:found};
  return null;
}
function parseTimes(raw){
  const out=[]; if(!raw) return out;
  for(const part of String(raw).split(/[;|\n]+/)){
    const p=part.trim(); if(!p) continue;
    const lab = (p.match(/morning|afternoon|evening|night|custom/i)||[])[0];
    const tm = p.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
    let time='';
    if(tm){ let h=+tm[1], mi=+(tm[2]||0); const ap=(tm[3]||'').toLowerCase(); if(ap==='pm'&&h<12) h+=12; if(ap==='am'&&h===12) h=0; if(h<24&&mi<60) time=pad(h)+':'+pad(mi); }
    let label = lab ? lab[0].toUpperCase()+lab.slice(1).toLowerCase() : '';
    if(label==='Night') label='Evening';
    if(!label) label = !time ? 'Morning' : +time.slice(0,2)<12 ? 'Morning' : +time.slice(0,2)<17 ? 'Afternoon' : 'Evening';
    out.push({label, time: time || (label==='Morning'?'08:00':label==='Afternoon'?'14:00':'20:00')});
  }
  return out.slice(0,4);
}
function csvLine(cells){ return cells.map(c=>{ const v=String(c??''); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; }).join(','); }
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const firstData = text.split(/\r?\n/).find(l=>l.trim() && !l.trim().startsWith('#')) || '';
  const delim = (firstData.split(';').length > firstData.split(',').length) ? ';' : ',';
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim()));
}

function normUnit(u){ u=String(u||'').toLowerCase().replace(/\s+/g,''); if(u==='mg') return 'mg'; if(u==='mcg'||u==='µg'||u==='ug') return 'mcg'; if(u==='ml') return 'ml'; if(/^(u|unit|units|iu)$/.test(u)) return 'units'; return null; }

function findPeptide(name){
  const nz = x => String(x||'').toLowerCase().replace(/[^a-z0-9+]/g,'');
  const k = nz(name); if(!k) return null;

function parseProtocolFile(text, fileName){
  const errors=[], notes=[];
  const dec = v => String(v??'').trim().replace(/^(\d+),(\d+)/,'$1.$2');
  const nm = v => num(dec(v));
  const rows = parseCSV(text).filter(r=>r.some(c=>c!=='') && !String(r[0]).startsWith('#'));
  const low = s => String(s||'').toLowerCase().trim();
  const kv={}, steps=[]; let mode='kv', schedHead=null; const sched=[];
  for(const r of rows){
    const a=low(r[0]);
    if(a==='from week'){ mode='steps'; continue; }
    if(a==='date' && r.some(c=>low(c)==='dose')){ mode='sched'; schedHead=r.map(low); continue; }
    if(['field','dose steps','schedule'].includes(a)) continue;
    if(a==='peptuno protocol'){ continue; }
    if(mode==='kv') kv[a]=r[1]??'';
    else if(mode==='steps') steps.push(r);
    else if(mode==='sched'){ const o={}; schedHead.forEach((h,i)=>o[h]=r[i]??''); sched.push(o); }
  }
  const pick = (...keys) => { for(const k of keys){ if(kv[k]!==undefined && kv[k]!=='') return kv[k]; } return ''; };
  let plan = {start:today(), weeksOn:0, weeksOff:nm(pick('weeks off')), cycles:Math.max(1,nm(pick('cycles'))||1), freq:null, times:[], phases:[]};
  const d = {peptide:'', name:pick('protocol name'), form: /liquid/i.test(pick('form'))?'liquid':'powder',
    recon:{mg:nm(pick('peptide per vial (mg)','peptide amount (mg)','vial size (mg)'))||10, ml:nm(pick('diluent volume (ml)','bac water (ml)','diluent (ml)'))||3},
    liquid:{vialMl:nm(pick('vial volume (ml)'))||10, conc:pick('strength (mg/ml)')===''?'':nm(pick('strength (mg/ml)'))}, notes:pick('notes'), nVials:1};
  if(d.form==='powder' && !(nm(pick('peptide per vial (mg)','peptide amount (mg)','vial size (mg)'))>0)) notes.push('The file had no vial amount, so the vial step uses 10 mg / 3 ml. Change it to match your vial.');
  if(steps.length){
    steps.forEach((r,i)=>{
      const n=i+1; let dose=dec(r[2]), unit=normUnit(r[3]);
      const dm = String(dose||'').match(/^\s*([\d.]+)\s*([a-zµ]+)?\s*$/i);
      if(!dm){ errors.push(`Dose step ${n}: "${r[2]||''}" isn't a number.`); return; }
      if(!unit && dm[2]) unit=normUnit(dm[2]);
      if(!unit){ errors.push(`Dose step ${n}: unit "${r[3]||''}" should be mg, mcg, ml or units.`); return; }
      const from=nm(r[0]), to=nm(r[1]||r[0]);
      if(!(from>=1) || to<from){ errors.push(`Dose step ${n}: check the week numbers (${r[0]||'?'} to ${r[1]||'?'}).`); return; }
      let pf=''; if(r[4]){ const want=strToFreq(r[4]); const key=Object.keys(PHASE_FREQ_STR).find(k=>k && JSON.stringify(strToFreq(PHASE_FREQ_STR[k]))===JSON.stringify(want)); if(key) pf=key; else notes.push(`Dose step ${n}: frequency "${r[4]}" isn't a step option, so it uses the protocol frequency.`); }
      plan.phases.push({from, to, dose:+dm[1], unit, units:r[6]&&isFinite(parseFloat(dec(r[6])))?parseFloat(dec(r[6])):'', optional:yes(r[5]), freq:pf});
    });
    const fStr = pick('frequency'); plan.freq = strToFreq(fStr);
    if(!plan.freq){ errors.push(`Frequency "${fStr}" wasn't recognised. Use one of: daily, every other day, every 3 days, 5 on 2 off, Mon Wed Fri, weekly Mon, days 1 3 5.`); plan.freq={type:'daily'}; }
    plan.times = parseTimes(pick('times'));
    plan.weeksOn = Math.max(nm(pick('weeks on')), ...plan.phases.map(p=>p.to), 0);
  } else if(sched.length){
    notes.push('This file only has a schedule table, so Peptuno rebuilt the dose steps and frequency from it. Check the vial step carefully.');
    const byWeek={}, times=new Set();
    for(const r of sched){
      const wm = String(r.week||'').match(/week\s*(\d+)/i); if(!wm) continue;
      const dm = dec(r.dose).match(/([\d.]+)\s*(mg|mcg|µg|ug|ml|units?|iu)?/i); if(!dm) continue;
      const w=+wm[1], dayN=num(r.day); const dw = dayN>0 ? (dayN-1)%7 : (Object.keys(byWeek[w]?.days||{}).length);
      const e = byWeek[w] ||= {dose:+dm[1], unit:normUnit(dm[2]||'mg')||'mg', opt:/optional/i.test(r.week), days:new Set(), units:r.units||''};
      e.days.add(dw); if(r.time) times.add(r.time);
    }
    const weeks = Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
    if(!weeks.length) errors.push('No doses were found in the schedule table.');
    for(const w of weeks){ const e=byWeek[w], last=plan.phases[plan.phases.length-1];
      if(last && last.to===w-1 && last.dose===e.dose && last.unit===e.unit && last.optional===e.opt && String(last.units)===String(e.units===''?'':parseFloat(e.units))) last.to=w;
      else plan.phases.push({from:w, to:w, dose:e.dose, unit:e.unit, units:e.units!==''&&isFinite(parseFloat(e.units))?parseFloat(e.units):'', optional:e.opt, freq:''}); }
    const counts={}; weeks.forEach(w=>{ const k=[...byWeek[w].days].sort().join(','); counts[k]=(counts[k]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0] || '0,1,2,3,4,5,6';
    const days = top.split(',').map(Number);
    plan.freq = days.length===7 ? {type:'daily'} : days.length===1 && weeks.length>1 ? {type:'rel', days} : {type:'rel', days};
    plan.times = parseTimes([...times].join(';'));
    plan.weeksOn = Math.max(0,...weeks);
    if(sched.some(r=>/weeks off/i.test(r.week||''))) notes.push('The file shows weeks off after the cycle but not how many. Set "Weeks OFF" in step 3.');
  } else {
    errors.push("This file doesn't look like a Peptuno protocol. Download the template to see the format.");
  }
  if(!plan.times.length) plan.times=[{label:'Morning', time:'08:00'}];
  if(plan.freq && plan.freq.type==='weekly' && plan.freq.weekday==null) plan.freq.weekday = parseD(plan.start).getDay();
  const fromFile = String(fileName||'').replace(/\.csv$/i,'').replace(/[-_]?protocol$/i,'').replace(/[-_]+/g,' ').trim();
  const pepName = pick('peptide') || d.name || fromFile;
  const found = findPeptide(pepName);
  if(found) d.peptide = found.key; else if(pepName){ d.peptide='__new'; d.newPep=pepName; notes.push(`"${pepName}" isn't in your library yet, so it will be added as a new peptide.`); }
  else notes.push('The file has no peptide name. Choose the peptide in step 1.');
  if(!d.name) d.name = found ? found.name+' Protocol' : pepName ? pepName.replace(/\s*protocol$/i,'')+' Protocol' : '';
  if(!plan.phases.length && !errors.length) errors.push('The file has no dose steps.');
  d.plan = plan;
  return {d, errors, notes};
}
function importProtocolFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    let res; try{ res = parseProtocolFile(String(rd.result||''), file.name); }catch(e){ res = {errors:["Couldn't read this file. Make sure it's a .csv file."], notes:[]}; }
    if(res.errors.length){
      openModal(()=>({narrow:true, title:"Couldn't import this protocol", body:`<p class="muted small" style="margin-bottom:10px">Fix these in the file and upload it again:</p><ul class="small" style="padding-left:18px;line-height:1.7">${res.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`,
        foot:`<button class="btn" data-act="dl-template">${I.dl}Download template</button><div class="r"><button class="btn primary" data-act="close">OK</button></div>`}));
      return;
    }
    openWizard(null, res.d);
    const tp = tmpProto(); cache.delete('__tmp'); const need = vialNeed(tp); if(need) wiz.d.nVials = need.req;
    wiz.importNote = res.notes; refreshModal();
  };
  rd.readAsText(file);
}

/* =================== import =================== */
function importFile(file){
  const msg = m => { const el=$('#imp-msg'); if(el) el.textContent=m; };
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || !d.core || !Array.isArray(d.core.protocols)) throw new Error('bad');
      const oldPids = S.core.protocols.map(p=>p.id);
      S = normalize(d); rev++; cache.clear(); fcCache.clear();
      oldPids.filter(id=>!S.core.protocols.some(p=>p.id===id)).forEach(id=>deletes.add(logDoc(id)));
      change('core','metrics',...S.core.protocols.map(p=>logDoc(p.id)));
      render(); msg(`Imported ${S.core.protocols.length} protocol${S.core.protocols.length===1?'':'s'} and ${S.metrics.entries.length} weight entr${S.metrics.entries.length===1?'y':'ies'}.`);
    }catch(e){ msg("That file isn't a Peptuno export."); }
  };
  rd.readAsText(file);
}

/* =================== downloads =================== */
async function save(filename, data){
  if(!downloads){
    if(!window.claude){ try{ const url=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'application/json'})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); }catch(e){ alertMsg("Couldn't save the file."); } return; }
    alertMsg('Downloads are only available in the published Peptuno page.'); return; }
  try{ await downloads.save({filename, data}); }catch(e){ if(e?.code!=='declined') alertMsg("Couldn't save the file here."); }
}
function alertMsg(m){ saveErr=m; render(); setTimeout(()=>{ if(saveErr===m){ saveErr=''; render(); } }, 4000); }
function csvFor(p){
  const b=build(p), f=forecast(p); const lines=[...templateSection(p), [], ['Schedule'], ['Date','Day','Week','Dose','Units','Time','Vial','Status']];
  for(const r of b.rows){ if(r.off){ lines.push([r.date,'','Weeks off','','','','','']); continue; }
    if(!r.on){ lines.push([r.date,r.day,'Week '+r.week,'','','','','Rest']); continue; }
    for(const k of r.keys){ const x=b.inst.find(y=>y.key===k), s=status(x), e=logOf(p.id)[k]; const vid=e?.alloc?.[0]?.[0]||f.firstVial[k]; const v=S.core.vials.find(v=>v.id===vid);
      lines.push([r.date,r.day,'Week '+r.week+(r.optional?' (optional)':''),doseTxt(x.ph),x.units??'',x.time,v?'Vial '+v.n:'',ST[s][0]]); } }
  return lines.map(csvLine).join('\n')+'\n';
}

let modalRender=null;
function openModal(fn){
  modalRender = ()=>{ const r=fn(); if(!r) return; const m=$('#modal'), sc=$('#scrim');
    const a=document.activeElement; if(a && m.contains(a) && a.matches('input,textarea,select')){ if(r.after) r.after(); return; }
    const st=m.scrollTop; m.className='modal'+(r.narrow?' narrow':'');
    m.innerHTML = `<div class="m-head"><h2>${r.title}</h2><button class="icon-btn" data-act="close" aria-label="Close">${I.x}</button></div><div class="m-body">${r.body}</div>${r.foot?`<div class="m-foot">${r.foot}</div>`:''}`;
    m.scrollTop=st; if(r.after) r.after(); };
  const was=$('#scrim').classList.contains('open'); $('#scrim').classList.add('open'); document.body.style.overflow='hidden';
  const mm=$('#modal'); mm.scrollTop=0; modalRender(); mm.scrollTop=0;
}
function refreshModal(){ const a=document.activeElement; if(a && $('#modal').contains(a)) a.blur(); if(modalRender) modalRender(); }
function closeModal(){ noteDraft=null; $('#scrim').classList.remove('open'); document.body.style.overflow=''; modalRender=null; wiz=null; delArm=null; evMode=null; pendingEdit=null; }

    case 'w-wd': case 'w-rel': { const f=wiz.d.plan.freq, n=+v, s=new Set(f.days||[]); s.has(n)?s.delete(n):s.add(n); f.days=[...s].sort(); refreshModal(); break; }

  }
});

    const f=t.dataset.f; let val = t.type==='checkbox'?t.checked : (t.type==='number'||t.dataset.num!==undefined) ? (t.value===''?'':parseFloat(t.value)) : t.value;
    const prevPep=wiz.d.peptide; setPath(wiz.d,f,val);
    if(f==='peptide'){ const oldN=pepOf(prevPep)?.name; if(val!=='__new' && (!wiz.d.name || wiz.d.name===oldN || wiz.d.name===oldN+' Protocol')) wiz.d.name = pepOf(val)?.name ? pepOf(val).name+' Protocol' : ''; }
    if(f==='newPep' && (!wiz.d.name || wiz.d.name===wiz.d._autoN)){ wiz.d.name = val ? val+' Protocol' : ''; wiz.d._autoN = wiz.d.name; const n=document.querySelector('[data-f=name]'); if(n) n.value=wiz.d.name; }
    if(t.dataset.re!==undefined && t.tagName==='SELECT'){ refreshModal(); return; }
    wizPreview();
  } else if(t.dataset.c){ calc[t.dataset.c]=t.value===''?'':parseFloat(t.value); const r=$('#calc-result'); if(r) r.innerHTML=calcResult(); }
  else if(t.id==='pep-q'){ pepQuery=t.value; const pos=t.selectionStart; render(); const q=$('#pep-q'); q.focus(); q.setSelectionRange(pos,pos); }
  else if(t.dataset.note){ if(noteDraft && noteDraft.key===t.dataset.key){ noteDraft.f[t.dataset.note]=t.value; noteDraft.dirty=true; noteDraft.saved=false; paintNoteStatus(); } }
  else if(t.dataset.pref){ const k=t.dataset.pref; S.core.profile[k] = t.type==='checkbox'?t.checked : t.type==='number'?Math.max(1,num(t.value)) : t.value; change('core'); if(k!=='name') render(); }
});
document.addEventListener('change', e=>{ const t=e.target; if(t.id==='proto-file' && t.files && t.files[0]){ importProtocolFile(t.files[0]); return; } if(t.id==='imp-file' && t.files && t.files[0]){ importFile(t.files[0]); return; } if(t.id==='hist-f'){ histFilter=t.value; render(); } else if(t.dataset.c){ render(); } else if(wiz && t.dataset.f==='plan.start'){ refreshModal(); } });
setInterval(()=>{ if(mode!=='loading' && !$('#scrim').classList.contains('open') && !menuOpen && (view==='dashboard'||view==='calendar')) render(); }, 60000);

/* =================== boot =================== */
(async function boot(){
  const local = loadLocal();
  const use = window.claude && typeof window.claude.use==='function' ? window.claude.use.bind(window.claude) : null;
  let db=null, user=null;
  if(use){ try{ [db,user,downloads] = await Promise.all([use('db'), use('user'), use('downloads')]); }catch(e){} }
  let id=null;
  if(user){ try{ const m=await user.me(); id=m.id; me={name:m.name||'', avatarUrl:m.avatarUrl||''}; }catch(e){} }
  if(db && id){
    mode='cloud'; coll = db.collection('data/users/'+id);
    let first=true;
    coll.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites || saving || dirty.size || (!first && Date.now()-lastLocal<2000)) return;
      const docs = {}; snap.docs.forEach(d=>{ if(d.exists) docs[d.id]=d.data(); });
      if(docs.core){
        const logs={}; for(const k in docs) if(k.startsWith('log_')) logs[k.slice(4)] = docs[k].e || {};
        S = normalize({core:docs.core, logs, metrics:docs.metrics}); rev++; saveLocal();
      } else if(first){
        if(docs.state){ S = migrateV1(docs.state); change('core','metrics',...S.core.protocols.map(p=>logDoc(p.id))); }
        else if(local && (local.core.protocols.length || local.metrics.entries.length)){ S = local; rev++; change('core','metrics',...S.core.protocols.map(p=>logDoc(p.id))); }
      }
      first=false; render();
    }, ()=>{ mode='local'; if(local){ S=local; rev++; } render(); });
    setTimeout(()=>{ if(first){ first=false; if(local){ S=local; rev++; } render(); } }, 7000);
  } else { mode='local'; if(local){ S=local; rev++; } render(); }
})();
</script>

if ('serviceWorker' in navigator && !window.claude && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
